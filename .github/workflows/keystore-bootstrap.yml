# توليد keystore إصدار جديد خاص بلعبة «سباق المعلومات» (مرة واحدة فقط).
# يولّد كلمتي مرور عشوائيتين قويتين ويطبع: كلمتي المرور، والاسم المستعار،
# وبصمة الشهادة SHA-256، وملف keystore بصيغة base64 على 4 دفعات متساوية.
# بعد حفظ الأسرار الأربعة في GitHub احذف هذا التشغيل من السجلات فوراً،
# لأن السجل يحتوي مادة keystore (محمية بكلمة المرور).
# لا يُثبّت هذا السير أي ملف؛ الـ keystore لا يغادر عدّاء CI إلا عبر السجل.
name: Keystore bootstrap (one-time)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: توليد keystore الإصدار
        run: |
          KS_PASS=$(openssl rand -hex 12)
          KEY_PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v \
            -keystore sibaq-release.keystore \
            -alias sibaq \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Sibaq Al-Maalumat, OU=Sibaq Al-Maalumat, O=Ali-awwww, L=Riyadh, ST=Riyadh, C=SA"
          echo "===== KEYSTORE PASSWORD (save as KEYSTORE_PASSWORD) ====="
          echo "$KS_PASS"
          echo "===== KEY PASSWORD (save as KEY_PASSWORD) ====="
          echo "$KEY_PASS"
          echo "===== KEY ALIAS (save as KEY_ALIAS) ====="
          echo "sibaq"
          echo "===== CERTIFICATE SHA-256 FINGERPRINT ====="
          keytool -list -v -keystore sibaq-release.keystore -storepass "$KS_PASS" -alias sibaq | grep -i "SHA256"
          echo "===== KEYSTORE FILE SHA-256 (for round-trip check) ====="
          sha256sum sibaq-release.keystore
          echo "===== KEYSTORE BASE64 (save as ANDROID_KEYSTORE_BASE64, 4 equal parts) ====="
          B64=$(base64 -w0 sibaq-release.keystore)
          LEN=${#B64}
          Q=$(( (LEN + 3) / 4 ))
          echo "BASE64_LENGTH=$LEN  CHUNK_SIZE=$Q"
          echo "----- PART 1 OF 4 -----"
          echo "${B64:0:$Q}"
          echo "----- PART 2 OF 4 -----"
          echo "${B64:$Q:$Q}"
          echo "----- PART 3 OF 4 -----"
          echo "${B64:$((2*Q)):$Q}"
          echo "----- PART 4 OF 4 -----"
          echo "${B64:$((3*Q))}"
          echo "===== END ====="
