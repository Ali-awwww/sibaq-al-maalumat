# إصدار v1.5.3: بناء APK أندرويد موقّع + حزمة الويب، ونشرهما في Release.
# يُشغَّل يدوياً؛ يبني الويب (dist) ثم يزامن Capacitor ويبني APK الإصدار
# موقّعاً بالـ keystore الجديد (من الأسرار)، ويتحقق من سلامة keystore
# (SHA-256 للملف) ومن بصمة شهادة APK قبل النشر.
# ملاحظة: لا نستخدم android-actions/setup-android لأنه يحاول تثبيت حزمة
# «tools» القديمة المحذوفة من مستودع SDK فيفشل؛ نستخدم SDK المثبّت مسبقاً.
# ملاحظة: مشروع أندرويد (Capacitor) يتطلب JDK 21 (source release 21).
name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: تجهيز مكونات Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | head -n 1); fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: بناء الويب ومزامنة Capacitor
        run: |
          npm install
          npm run build
          npx cap sync android
      - name: استعادة keystore الإصدار والتحقق من سلامته
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/sibaq-release.keystore
          ACTUAL=$(sha256sum android/app/sibaq-release.keystore | cut -d' ' -f1)
          EXPECTED=33ebe65c72e892f95e5a8fbaffa5dc776befb3664a0342a8b7dc3052960d9b96
          echo "Keystore SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "KEYSTORE MISMATCH — the stored base64 does not match the generated keystore"; exit 1; fi
          echo "Keystore verified: SHA-256 matches the generated keystore"
      - name: بناء APK الإصدار الموقّع
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/sibaq-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          ls -lh app/build/outputs/apk/release/
      - name: التحقق من توقيع APK وبصمة الشهادة
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== APK SHA-256 ====="
          sha256sum "$APK"
          echo "===== APK cert (keytool -printcert) ====="
          keytool -printcert -jarfile "$APK"
          CERT_SHA=$(keytool -printcert -jarfile "$APK" | grep -i "SHA256" | head -n 1 | tr -d ' \t' | cut -d: -f2- | tr 'a-f' 'A-F')
          EXPECTED_CERT="FC:BA:6D:1F:EC:23:A9:D8:53:BE:64:81:4D:3D:C1:FB:9E:3A:E7:4D:92:38:2F:2B:97:0D:0F:61:C8:04:61:E0"
          echo "APK cert SHA-256: $CERT_SHA"
          echo "Expected SHA-256:  $EXPECTED_CERT"
          if [ "$CERT_SHA" != "$EXPECTED_CERT" ]; then echo "CERT FINGERPRINT MISMATCH — APK is not signed with the new keystore"; exit 1; fi
          echo "APK signature verified: cert SHA-256 matches the new keystore"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | head -n 1)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs "$APK"; else echo "apksigner not found under build-tools (keytool check above is authoritative)"; fi
      - name: حزم نسخة الويب وتجهيز المرفقات
        run: |
          cd dist
          zip -r ../sibaq-al-maalumat-web-v1.5.3.zip .
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk sibaq-al-maalumat-v1.5.3.apk
          ls -lh sibaq-al-maalumat-v1.5.3.apk sibaq-al-maalumat-web-v1.5.3.zip
      - name: نشر Release v1.5.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.txt <<'EOF'
          تحديث سباق المعلومات إلى v1.5.3:
          - إصلاح بقاء وحفظ تسجيل الدخول بـ Google في تطبيق أندرويد (Capacitor): استخدام رابط إعادة التوجيه المخصص sibaqalmaalumat://auth/callback عند التشغيل الأصلي، وفتح تدفق OAuth خارج WebView عبر إضافة @capacitor/browser، ومعالجة العودة في الإقلاع البارد عبر App.getLaunchUrl() بجانب appUrlOpen لحفظ الجلسة داخل التطبيق مباشرة.
          - الحفاظ الكامل على كل مميزات v1.5.2، وبنك الأسئلة (634 سؤالاً)، وقواعد اللعبة، والوضعين الفاتح والداكن.
          EOF
          gh release create v1.5.3 \
            --title "سباق المعلومات v1.5.3" \
            --notes-file release-notes.txt \
            sibaq-al-maalumat-v1.5.3.apk sibaq-al-maalumat-web-v1.5.3.zip
            
